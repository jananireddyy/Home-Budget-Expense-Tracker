
{% extends "base.html" %}
{% block title %}Add Transaction | Home Budget{% endblock %}

{% block content %}
<h1 class="mb-4">Add Transaction</h1>

<div class="content-card form-card">
<form method="POST" id="transactionForm">

    <div class="mb-3">
        <label class="form-label">Transaction date</label>
        <input class="form-control" type="date"
               name="transaction_date"
               value="{{ today }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Transaction type</label>
        <select class="form-select" name="transaction_type"
                id="transaction_type" required>
            <option value="Expense" selected>Expense</option>
            <option value="Income">Income</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <select class="form-select" name="category_id"
                id="category_id" required>
            {% for category in categories %}
            <option value="{{ category.category_id }}"
                    data-type="{{ category.category_type }}">
                {{ category.category_name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Amount (₹)</label>
        <input class="form-control" type="number"
               name="amount" min="0.01"
               step="0.01" placeholder="Enter amount" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <input class="form-control" type="text"
               name="description"
               maxlength="255"
               placeholder="Enter details">
    </div>

    <button type="submit" class="btn btn-primary">
        Save Transaction
    </button>

    <a class="btn btn-light"
       href="{{ url_for('transactions') }}">Cancel</a>

</form>
</div>
{% endblock %}
